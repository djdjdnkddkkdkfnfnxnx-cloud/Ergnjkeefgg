<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DNB VVQN</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#start {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
}

#start button {
    font-size: 30px;
    padding: 25px 50px;
    cursor: pointer;
}

.gifWindow {
    position: fixed;
    width: 220px;
    height: 160px;
    border: 5px solid black;
    background: white;
    z-index: 9999;
    pointer-events: none;
}

.gifWindow img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>

<body>

<div id="start">
    <button>CLICK TO BEGIN</button>
</div>

<script>

const GIF_URL = "fh7cm2.gif";

let started = false;


/* =========================
   ACTIVATE EVERYTHING
========================= */

async function activateEverything() {

    if (started) return;

    started = true;


    /* FULLSCREEN */

    try {
        await document.documentElement.requestFullscreen();
    } catch (error) {
        console.log("Fullscreen was blocked:", error);
    }


    /* REMOVE START SCREEN */

    const start = document.getElementById("start");

    if (start) {
        start.remove();
    }


    /* CREATE GIFS */

    createGifWindows(10);


    /* ATTEMPT DOWNLOAD */

    downloadGif();


    /* KEEP SPAWNING MORE GIFS */

    setInterval(function() {
        createGifWindows(2);
    }, 5000);


    /* CONSTANTLY CHANGE TITLE */

    setInterval(function() {

        const titles = [
            "WHY",
            "STOP",
            "HELLO",
            "ERROR",
            "LEAVE",
            "WHY ARE YOU HERE",
            "AAAAAAAA",
            "THE WEBSITE",
            "WHAT",
            "NO",
            "HELP",
            "WHY DID YOU CLICK"
        ];

        document.title =
            titles[Math.floor(Math.random() * titles.length)];

    }, 500);
}


/* =========================
   BOUNCING GIF WINDOWS
========================= */

function createGifWindows(amount) {

    for (let i = 0; i < amount; i++) {

        const box = document.createElement("div");

        box.className = "gifWindow";


        const img = document.createElement("img");

        img.src = GIF_URL;

        box.appendChild(img);

        document.body.appendChild(box);


        /* RANDOM START POSITION */

        let x =
            Math.random() *
            Math.max(1, window.innerWidth - 230);

        let y =
            Math.random() *
            Math.max(1, window.innerHeight - 170);


        /* RANDOM SPEED */

        let dx =
            Math.random() * 6 + 2;

        let dy =
            Math.random() * 6 + 2;


        /* RANDOM DIRECTION */

        if (Math.random() < 0.5) {
            dx *= -1;
        }

        if (Math.random() < 0.5) {
            dy *= -1;
        }


        /* BOUNCE */

        function move() {

            x += dx;
            y += dy;


            if (
                x <= 0 ||
                x >= window.innerWidth - 230
            ) {
                dx *= -1;
            }


            if (
                y <= 0 ||
                y >= window.innerHeight - 170
            ) {
                dy *= -1;
            }


            box.style.left = x + "px";
            box.style.top = y + "px";


            requestAnimationFrame(move);
        }


        move();
    }
}


/* =========================
   DOWNLOAD GIF
========================= */

function downloadGif() {

    const link = document.createElement("a");

    link.href = GIF_URL;

    link.download = "fh7cm2.gif";

    document.body.appendChild(link);

    link.click();

    link.remove();
}


/* =========================
   ANY FIRST CLICK
========================= */

document.addEventListener(
    "click",
    activateEverything,
    { once: true }
);

</script>

</body>
</html>
